services:
  image-resizer:
    image: smeagolworms4/image-resizer:latest
    # Décommentez pour reconstruire localement, par exemple pour ajouter ffmpeg
    # (vignettes vidéo) :
    # build:
    #   context: .
    #   args:
    #     INSTALL_FFMPEG: "true"
    container_name: image-resizer
    restart: unless-stopped
    # Laisse les transformations en cours se terminer plutôt que de couper net.
    stop_grace_period: 30s
    # Écrit dans ./cache avec votre UID plutôt qu'en root.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Une source au moins, et tous les réglages que vous voulez changer. La
    # liste complète est dans .env.example.
    environment:
      SOURCE_DEMO: /app/public
      #SOURCE_PHOTOS: /photos
      #SOURCE_CDN: https://storage.example.com
      #MAX_SIZE: "2048"
      #DEFAULT_QUALITY: "80"
      # Signature des URL : vide (défaut) = tout est servi comme avant. Voir
      # SIGNATURE.fr.md pour produire la signature côté application.
      #SIGNATURE_KEY: "une-longue-chaîne-secrète"
    # Si vous préférez tenir ces réglages dans un fichier, décommentez ceci —
    # le fichier devra alors exister.
    #env_file:
    #  - .env
    ports:
      - "${PORT_HOST:-3000}:3000"
    volumes:
      - ./cache:/cache
      # - /chemin/vers/vos/photos:/photos:ro
